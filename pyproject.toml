[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adh-ai-labs"
version = "0.1.0"
description = "Colab labs for the Oxford Applied Digital Health MSc AI module: deep learning and LLMs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "matplotlib>=3.8",
]
authors = [{name = "Bradley Segal"}]
license = "MIT"

[project.optional-dependencies]
# Colab already has torch; this extra is for running the notebooks elsewhere.
dl = ["torch>=2.4"]
llm = [
    "mcp>=2.3,<3",
    "openai>=1.50",
]
# Notebook 02 runs small open models on the CPU. Colab already has both.
text = [
    "transformers>=4.46",
    "sentence-transformers>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adh_ai_labs = ["assets/*", "assets/recordings/*"]
